name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-tag merge to main
        id: tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "$existing" ]; then
            echo "HEAD already tagged as ${existing}; skipping"
            echo "tag=${existing}" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          msg=$(git log -1 --pretty=%B HEAD)

          # Python CLI line ends at v0.0.6 — first Go release jumps to v0.1.0.
          if [ -z "${latest}" ] || [[ "${latest}" =~ ^v0\.0\. ]]; then
            next="v0.1.0"
          else
            ver="${latest#v}"
            IFS='.' read -r major minor patch <<<"${ver}"
            if printf '%s' "${msg}" | grep -qE '(^|[^[:alnum:]])#major([^[:alnum:]]|$)|BREAKING CHANGE'; then
              major=$((major + 1)); minor=0; patch=0
            elif printf '%s' "${msg}" | grep -qE '(^|[^[:alnum:]])#minor([^[:alnum:]]|$)'; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="v${major}.${minor}.${patch}"
          fi

          echo "Bumping ${latest:-<none>} -> ${next}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${next}" -m "${next}"
          git push origin "${next}"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: startsWith(github.ref, 'refs/tags/') || steps.tag.outputs.created == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        if: startsWith(github.ref, 'refs/tags/') || steps.tag.outputs.created == 'true'
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
