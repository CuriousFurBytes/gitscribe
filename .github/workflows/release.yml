name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide first Go release
        id: bootstrap
        if: github.ref == 'refs/heads/main'
        run: |
          # The Python CLI line ends at v0.0.6. The Go rewrite jumps to v0.1.0;
          # after that, fall back to default semver patch bumps.
          if git tag -l 'v*' | sort -V | tail -n1 | grep -qE '^v0\.0\.'; then
            echo "custom_tag=v0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump tag
        id: tag
        if: github.ref == 'refs/heads/main'
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          INITIAL_VERSION: 0.1.0
          TAG_CONTEXT: repo
          CUSTOM_TAG: ${{ steps.bootstrap.outputs.custom_tag }}

      - name: Skip release if no new tag
        id: gate
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -z "${{ steps.tag.outputs.new_tag }}" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.release == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        if: steps.gate.outputs.release == 'true'
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.new_tag }}
